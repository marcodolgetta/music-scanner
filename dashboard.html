<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #14110f;
    --lane-bg: #1d1815;
    --lane-bg-hover: #241e19;
    --wood-line: #322a23;
    --cream-solid: #ede7dd;
    --mustard: #d8a93b;
    --mustard-dim: #a3813a;
    --teal: #3e7c74;
    --ink: #1a1613;
    --muted: #9a8f82;
  }

  * { box-sizing: border-box; }

  #root-crate {
    background: var(--bg);
    color: var(--cream-solid);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    padding: 28px 24px 48px;
    border-radius: 14px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--wood-line);
    padding-bottom: 18px;
  }

  .header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 34px;
    margin: 0 0 4px 0;
    letter-spacing: -0.01em;
  }

  .header .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search {
    background: var(--lane-bg);
    border: 1px solid var(--wood-line);
    color: var(--cream-solid);
    padding: 9px 12px;
    border-radius: 7px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    width: 200px;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { outline: none; border-color: var(--mustard-dim); }

  .file-btn {
    background: var(--mustard);
    color: var(--ink);
    border: none;
    padding: 9px 14px;
    border-radius: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .file-btn:hover { background: #e6b64a; }
  #file-input { display: none; }

  .stats {
    display: flex;
    gap: 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .stats b { color: var(--teal); font-weight: 500; }

  .lane {
    margin-bottom: 22px;
  }

  .lane-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--wood-line);
    color: var(--cream-solid);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 12px 5px 10px;
    border-radius: 0 0 6px 6px;
    margin-bottom: 0;
  }
  .lane-label .count {
    background: var(--mustard);
    color: var(--ink);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 10px;
  }

  .lane-body {
    background: var(--lane-bg);
    border: 1px solid var(--wood-line);
    border-radius: 4px 10px 10px 10px;
    padding: 14px;
    display: flex;
    align-items: flex-start;
    gap: 40px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .lane-body::-webkit-scrollbar { height: 6px; }
  .lane-body::-webkit-scrollbar-thumb { background: var(--wood-line); border-radius: 3px; }

  .sleeve {
    flex: 0 0 190px;
    background: var(--cream-solid);
    color: var(--ink);
    border-radius: 3px;
    padding: 0;
    cursor: pointer;
    display: block;
    position: relative;
    overflow: visible;
    transition: transform 0.15s ease, box-shadow 0.15s ease, flex-basis 0.15s ease;
    box-shadow:
      1px 1px 0 rgba(0,0,0,0.35),
      2px 2px 0 rgba(0,0,0,0.28),
      3px 3px 0 rgba(0,0,0,0.2),
      4px 5px 10px rgba(0,0,0,0.35);
  }
  .sleeve:hover {
    transform: translateY(-4px) rotate(-1deg);
    box-shadow: 4px 6px 0 rgba(0,0,0,0.3);
  }
  .sleeve.expanded {
    flex-basis: 320px;
  }
  .sleeve.expanded:hover {
    transform: none;
  }

  /* The vinyl disc: sits behind the cover art, poking out past the jacket's
     right edge, like a record half-pulled out of its sleeve. Sized big
     enough to actually read as a record, not a decorative sliver. */
  .vinyl-peek {
    position: absolute;
    top: 4%;
    right: -22%;
    width: 82%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #1c1a18 0px, #1c1a18 3px, #2e2a26 3px, #2e2a26 6px);
    box-shadow: -4px 3px 12px rgba(0,0,0,0.5);
    z-index: 1;
  }
  .vinyl-peek::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14%;
    height: 14%;
    background: var(--lane-bg);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* The cover art itself: no real album art to show, so each lane gets a
     consistent gradient derived from its own name (see hashColor() in the
     script) — different lanes look visually distinct, same lane stays
     recognizable card to card. ::before adds a diagonal grain texture and
     ::after adds a vignette, so it reads as printed cardboard rather than
     a flat color swatch. */
  .jacket-art {
    position: relative;
    z-index: 2;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 3px 3px 0 0;
    overflow: hidden;
  }
  .jacket-art::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      135deg,
      rgba(255,255,255,0.07) 0px, rgba(255,255,255,0.07) 1px,
      transparent 1px, transparent 5px
    );
    pointer-events: none;
  }
  .jacket-art::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.35), inset 0 0 34px rgba(0,0,0,0.4);
    pointer-events: none;
  }

  /* Artist/title/meta printed directly on the cover, like real sleeve
     typography — anchored to the bottom, with a dark scrim behind the
     text so it stays legible no matter what hue the art happens to be. */
  .jacket-text {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3;
    padding: 18px 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background: linear-gradient(to top,
      rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.6) 50%, transparent 100%);
  }
  .jacket-text .artist {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 10.5px;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.72);
    margin-bottom: 7px;
    position: relative;
    padding-bottom: 7px;
  }
  .jacket-text .artist::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 1px;
    background: rgba(255,255,255,0.4);
  }
  .jacket-text .title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.005em;
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.75);
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .jacket-text .meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    border-top: 1px solid rgba(255,255,255,0.22);
    padding-top: 6px;
    width: 100%;
  }
  .jacket-text .meta .dot {
    opacity: 0.5;
  }

  .expand-panel {
    margin: 10px 13px 0;
    padding-top: 10px;
    border-top: 1px dashed #cfc7b8;
    font-family: 'Inter', sans-serif;
  }
  .expand-row {
    font-size: 12px;
    margin-bottom: 5px;
    color: #4a4238;
  }
  .expand-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--mustard-dim);
    margin-right: 5px;
  }
  .preview-embed {
    width: 100%;
    height: 170px;
    border: none;
    border-radius: 3px;
    margin-bottom: 10px;
    display: block;
  }
  .preview-audio {
    width: 100%;
    margin-bottom: 10px;
    display: block;
  }
  .open-btn {
    background: var(--teal);
    color: var(--cream-solid);
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    margin-top: 4px;
  }
  .open-btn:hover {
    background: #4a9188;
  }



  .empty {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 60px 20px;
    border: 1px dashed var(--wood-line);
    border-radius: 10px;
  }
  .empty b { color: var(--mustard); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--cream-solid);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.4;
    padding: 12px 18px;
    border-radius: 8px;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .view-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .toggle-btn {
    background: transparent;
    border: 1px solid var(--wood-line);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .toggle-btn:hover {
    border-color: var(--mustard-dim);
    color: var(--cream-solid);
  }
  .toggle-btn.active {
    background: var(--mustard);
    border-color: var(--mustard);
    color: var(--ink);
    font-weight: 500;
  }
</style>

<div id="root-crate">
  <div class="header">
    <div>
      <h1>The Rack</h1>
      <div class="sub" id="last-run">no scan loaded yet</div>
    </div>
    <div class="controls">
      <input class="search" id="search" placeholder="filter by artist or title..." />
      <input class="search" id="suggestion-input" placeholder="suggest an artist/label/channel..." maxlength="200" />
      <button class="file-btn" id="suggestion-submit">SUGGEST</button>
      <label class="file-btn" for="file-input">LOAD SCAN.JSON</label>
      <input type="file" id="file-input" accept="application/json" />
    </div>
  </div>
  <div class="view-toggle" id="view-toggle">
    <button class="toggle-btn active" data-view="music">🎧 Direct Listens</button>
    <button class="toggle-btn" data-view="article">📰 Articles &amp; News</button>
    <button class="toggle-btn" data-view="all">All</button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="lanes"></div>
</div>

<script>
  const SAMPLE = {
    "last_run": "2026-07-13T08:00:00+00:00",
    "entries": [
      {"title":"Overmono Shares New Single \"Skyline\"","link":"https://example.com/1","published":"Sun, 12 Jul 2026 14:00:00 GMT","source":"Pitchfork","genres":["Electronic","Dance"],"artist":"Overmono","link_type":"article","scanned_at":"2026-07-13T08:00:00+00:00"},
      {"title":"Wednesday Announces New Album, Shares Lead Single","link":"https://example.com/2","published":"Sun, 12 Jul 2026 10:00:00 GMT","source":"Stereogum","genres":["Indie Rock"],"artist":"Wednesday","link_type":"article","scanned_at":"2026-07-13T08:00:00+00:00"},
      {"title":"Little Simz Drops Surprise Track","link":"https://example.com/3","published":"Sat, 11 Jul 2026 19:30:00 GMT","source":"The Fader","genres":["Hip-Hop"],"artist":"Little Simz","link_type":"article","scanned_at":"2026-07-13T08:00:00+00:00"},
      {"title":"Fontaines D.C. - New Song","link":"https://example.com/4","published":"Sat, 11 Jul 2026 09:00:00 GMT","source":"KEXP (In Our Headphones)","genres":["Indie/Punk"],"artist":"Fontaines D.C.","link_type":"music","scanned_at":"2026-07-13T07:00:00+00:00"},
      {"title":"Jamie xx Unveils Collaborative EP","link":"https://example.com/5","published":"Fri, 10 Jul 2026 15:00:00 GMT","source":"XL Recordings","genres":["Electronic"],"artist":"Jamie xx","link_type":"music","scanned_at":"2026-07-12T08:00:00+00:00"}
    ]
  };

  let currentData = SAMPLE;
  let filterText = "";
  let currentView = "music"; // "all" | "music" | "article"
  let expandedLink = null; // link of the currently tap-expanded card, or null

  function timeAgo(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
    if (diffMin < 60) return diffMin + "m ago";
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return diffH + "h ago";
    return Math.round(diffH / 24) + "d ago";
  }

  function postTime(e) {
    // Prefer the normalized timestamp scan_music.py stores, fall back to
    // the feed's raw published string, and only use scan time as a last
    // resort if a post genuinely has no date at all.
    return e.published_iso || e.published || e.scanned_at;
  }

  function hashColor(str) {
    // Same string always produces the same color (a stable "identity" per
    // lane), different strings spread out across the color wheel. This is
    // just a simple string hash turned into a hue, not real album art —
    // there's no image data to work with, so this is the honest substitute.
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    const hue = Math.abs(hash) % 360;
    return {
      a: `hsl(${hue}, 55%, 42%)`,
      b: `hsl(${(hue + 45) % 360}, 60%, 28%)`,
    };
  }

  function hasUnknownArtist(e) {
    return !e.artist || e.artist === "Unknown";
  }

  function displayArtist(e) {
    // scan_music.py stores the literal string "Unknown" when guess_artist()
    // can't figure it out — not an empty value — so a plain `e.artist ||
    // fallback` never actually triggers (a non-empty string is truthy).
    // We need an explicit check against that specific string instead.
    if (hasUnknownArtist(e)) {
      return e.source || "Unknown";
    }
    return e.artist;
  }

  function render() {
    const entries = currentData.entries || [];
    const q = filterText.trim().toLowerCase();

    // Entries scanned before this feature existed won't have link_type set
    // yet — they'll only show up under "All" until a future scan re-tags
    // them (they naturally age out and get replaced within a month anyway).
    const viewFiltered = currentView === "all"
      ? entries
      : entries.filter(e => e.link_type === currentView);

    const filtered = q
      ? viewFiltered.filter(e => (e.artist + " " + e.title).toLowerCase().includes(q))
      : viewFiltered;

    const untagged = currentView !== "all" ? entries.filter(e => !e.link_type).length : 0;

    document.getElementById("last-run").textContent = currentData.last_run
      ? "last scan " + timeAgo(currentData.last_run) + " · " + entries.length + " tracks in the crate"
        + (untagged ? ` (${untagged} untagged, rerun scan to sort them)` : "")
      : "no scan loaded yet";

    const artistSet = new Set(filtered.map(e => e.artist));
    const genreSet = new Set();
    filtered.forEach(e => (e.genres || ["Uncategorized"]).forEach(g => genreSet.add(g)));
    document.getElementById("stats").innerHTML =
      `<span><b>${filtered.length}</b> tracks</span><span><b>${artistSet.size}</b> artists</span><span><b>${genreSet.size}</b> genres</span>`;

    const laneContainer = document.getElementById("lanes");
    laneContainer.innerHTML = "";

    if (!filtered.length) {
      let message;
      if (currentView !== "all" && untagged === entries.length && entries.length > 0) {
        const viewLabel = currentView === "music" ? "Direct Listens" : "Articles & News";
        message = `None of your ${entries.length} tracks are tagged as <b>${viewLabel}</b> yet — this data predates that feature. Rerun scan_music.py to classify new entries going forward, or check <b>All</b> to see everything you've got so far.`;
      } else if (q) {
        message = `No tracks match "${escapeHtml(filterText)}". Try clearing the search.`;
      } else {
        message = `No tracks here yet. Hit <b>LOAD SCAN.JSON</b> to load real results from scan_music.py.`;
      }
      laneContainer.innerHTML = `<div class="empty">${message}</div>`;
      return;
    }

    const byGenre = {};
    filtered.forEach(e => {
      let primary;
      if (hasUnknownArtist(e)) {
        primary = e.source || "Unknown Source";
      } else {
        const genres = (e.genres && e.genres.length) ? e.genres : ["Uncategorized"];
        primary = genres[0];
      }
      if (!byGenre[primary]) byGenre[primary] = [];
      byGenre[primary].push(e);
    });

    Object.keys(byGenre)
      .sort((a, b) => byGenre[b].length - byGenre[a].length)
      .forEach(genre => {
        const items = byGenre[genre].slice().sort((a, b) =>
          new Date(postTime(b)) - new Date(postTime(a))
        );

        const lane = document.createElement("div");
        lane.className = "lane";

        const label = document.createElement("div");
        label.className = "lane-label";
        label.innerHTML = `${genre} <span class="count">${items.length}</span>`;
        lane.appendChild(label);

        const body = document.createElement("div");
        body.className = "lane-body";

        const laneColor = hashColor(genre);

        items.forEach(e => {
          const card = document.createElement("div");
          const isExpanded = expandedLink === e.link;
          card.className = "sleeve" + (isExpanded ? " expanded" : "");
          card.innerHTML = `
            <div class="vinyl-peek"></div>
            <div class="jacket-art" style="background: linear-gradient(135deg, ${laneColor.a}, ${laneColor.b});">
              <div class="jacket-text">
                <div class="artist">${escapeHtml(displayArtist(e))}</div>
                <div class="title">${escapeHtml(e.title || "")}</div>
                <div class="meta"><span>${escapeHtml(e.source || "")}</span><span class="dot">·</span><span>${timeAgo(postTime(e))}</span></div>
              </div>
            </div>
            ${isExpanded ? buildExpandedPanel(e) : ""}
          `;
          card.addEventListener("click", (ev) => {
            // Clicks inside the expanded panel (the Open button, an audio
            // player's controls) shouldn't re-collapse the card — only the
            // card's own body should toggle it.
            if (ev.target.closest(".expand-panel")) return;
            expandedLink = isExpanded ? null : e.link;
            render();
          });
          body.appendChild(card);
        });

        lane.appendChild(body);
        laneContainer.appendChild(lane);
      });
  }

  function buildExpandedPanel(e) {
    const genres = (e.genres && e.genres.length) ? e.genres.join(", ") : "Uncategorized";
    const fullDate = (() => {
      const d = new Date(postTime(e));
      return isNaN(d) ? "" : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    })();

    let player = "";
    if (e.preview && e.preview.type === "youtube") {
      player = `<iframe class="preview-embed" src="https://www.youtube.com/embed/${encodeURIComponent(e.preview.video_id)}"
                  allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    } else if (e.preview && e.preview.type === "audio") {
      player = `<audio class="preview-audio" controls src="${escapeHtml(e.preview.url)}"></audio>`;
    }

    return `
      <div class="expand-panel">
        ${player}
        <div class="expand-row"><span class="expand-label">Genres</span> ${escapeHtml(genres)}</div>
        <div class="expand-row"><span class="expand-label">Posted</span> ${escapeHtml(fullDate)}</div>
        <button class="open-btn" data-link="${escapeHtml(e.link || "")}">Open ↗</button>
      </div>
    `;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[s]));
  }

  function openLink(url) {
    if (!url) return;
    let win;
    try {
      win = window.open(url, "_blank", "noopener,noreferrer");
    } catch (err) {
      win = null;
    }
    if (win) return;

    // Popup was blocked (common inside a sandboxed preview). Fall back to
    // copying the link so the person can paste it into a real browser tab.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        () => showToast("Link copied — this preview blocks new tabs. Paste it into your browser, or open dashboard.html directly to click through."),
        () => showToast(url)
      );
    } else {
      showToast(url);
    }
  }

  let toastTimer = null;
  function showToast(message) {
    let toast = document.getElementById("toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "toast";
      toast.className = "toast";
      document.getElementById("root-crate").appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add("visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("visible"), 4500);
  }

  document.getElementById("view-toggle").addEventListener("click", (ev) => {
    const btn = ev.target.closest(".toggle-btn");
    if (!btn) return;
    currentView = btn.dataset.view;
    document.querySelectorAll(".toggle-btn").forEach(b => b.classList.toggle("active", b === btn));
    render();
  });

  // Cards (and their "Open" buttons) get rebuilt every render(), so we
  // can't attach a listener to each button directly — it'd be gone by the
  // time someone clicks it. Instead, one listener sits on #lanes (which
  // itself never gets replaced) and checks what was actually clicked.
  document.getElementById("lanes").addEventListener("click", (ev) => {
    const btn = ev.target.closest(".open-btn");
    if (!btn) return;
    ev.stopPropagation(); // don't also trigger the card's own expand/collapse
    openLink(btn.dataset.link);
  });

  document.getElementById("search").addEventListener("input", (ev) => {
    filterText = ev.target.value;
    render();
  });

  // Points at the Cloudflare Worker that safely creates a GitHub issue on
  // your behalf — see suggestion-worker.js for what runs on the other end.
  const SUGGESTION_ENDPOINT = "https://music-scanner-suggestions.allfatherarts.workers.dev/";

  document.getElementById("suggestion-submit").addEventListener("click", submitSuggestion);
  document.getElementById("suggestion-input").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") submitSuggestion();
  });

  async function submitSuggestion() {
    const input = document.getElementById("suggestion-input");
    const btn = document.getElementById("suggestion-submit");
    const suggestion = input.value.trim();
    if (!suggestion) return;

    btn.disabled = true;
    btn.textContent = "SENDING...";

    try {
      const res = await fetch(SUGGESTION_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ suggestion }),
      });
      const data = await res.json();

      if (res.ok && data.success) {
        showToast("Thanks! Your suggestion was submitted.");
        input.value = "";
      } else {
        showToast("Couldn't submit that — try again in a bit.");
      }
    } catch (err) {
      showToast("Couldn't reach the suggestion box — check your connection.");
    } finally {
      btn.disabled = false;
      btn.textContent = "SUGGEST";
    }
  }

  document.getElementById("file-input").addEventListener("change", (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        currentData = parsed;
        render();
      } catch (err) {
        alert("Couldn't parse that file as JSON: " + err.message);
      }
    };
    reader.readAsText(file);
  });

  render();

  // When this page is actually hosted (e.g. GitHub Pages) rather than
  // opened as a local file, output.json sits right next to it — load it
  // automatically instead of making you click "LOAD SCAN.JSON" every time.
  // Opening dashboard.html directly from disk (file://) blocks fetch() for
  // security reasons, so this just quietly fails there and you fall back
  // to the manual button, same as before.
  fetch("./output.json", { cache: "no-store" })
    .then((res) => (res.ok ? res.json() : Promise.reject()))
    .then((parsed) => {
      currentData = parsed;
      render();
    })
    .catch(() => {
      // Not hosted, or output.json isn't there yet — sample data stays up.
    });

</script>
